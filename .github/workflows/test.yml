name: Tests

on:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'

jobs:
  test:
    name: 'Ruby ${{ matrix.ruby }} × Sidekiq v${{ matrix.sidekiq }} × ActiveJob v${{ matrix.activejob }}'
    # Skip running tests for local pull requests (use push event instead), run only for foreign ones
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login != github.event.pull_request.base.repo.owner.login
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sidekiq 6.5 is what zype-core and ffprobe-service run (sidekiq-pro < 7)
          - ruby: '4.0'
            sidekiq: '6.5'
            activejob: '8.1'
          - ruby: '3.4'
            sidekiq: '6.5'
            activejob: '8.1'
          - ruby: '3.4'
            sidekiq: '6.5'
            activejob: '8.0'
          - ruby: '3.3'
            sidekiq: '6.5'
            activejob: '7.1'
          - ruby: '3.3'
            sidekiq: '6.5'
            activejob: '6.1'
          # Sidekiq 7 and 8
          - ruby: '3.4'
            sidekiq: '7.3'
            activejob: '8.0'
          - ruby: '4.0'
            sidekiq: '8.1'
            activejob: '8.1'
    env:
      SIDEKIQ_VERSION: '${{ matrix.sidekiq }}'
      ACTIVEJOB_VERSION: '${{ matrix.activejob }}'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run RSpec
        run: bundle exec rspec
